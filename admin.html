<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | FOCUS360 STUDIO</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
.adm{max-width:960px;margin:0 auto;padding:2.5rem 1.25rem 5rem}.adm h1,.adm h2{margin:0 0 1.2rem}.adm section{margin-bottom:3.5rem}
.row{display:flex;gap:1rem;align-items:center;justify-content:space-between;padding:.9rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row small{color:var(--mute)}.row .btn{padding:.6rem 1rem}.checks{display:flex;gap:1.5rem;margin-bottom:1.8rem}.msg{padding:1rem 0;border-top:1px solid var(--line)}.msg p{margin:.3rem 0;white-space:pre-wrap}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/supabase-config.js" defer></script>
<script src="js/homepage-fields.js" defer></script>
</head>
<body style="background:var(--bone);color:var(--ink)">
<main class="adm">
  <h1 class="display h-md">Studio admin</h1>

  <section id="login">
    <form id="login-form" class="form" novalidate>
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn--solid" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <p><button class="btn" id="signout" type="button">Sign out</button></p>
    <section>
      <h2 class="display h-md" id="form-title">Add project</h2>
      <form id="pform" class="form" novalidate>
        <div class="field--2">
          <label class="field"><span>Title *</span><input name="title" required maxlength="200"></label>
          <label class="field"><span>Category *</span><select name="category" required></select></label>
        </div>
        <label class="field"><span>Summary</span><textarea name="summary"></textarea></label>
        <div class="field--2">
          <label class="field"><span>Client</span><input name="client"></label>
          <label class="field"><span>Year</span><input name="year" maxlength="4"></label>
        </div>
        <div class="field--2">
          <label class="field"><span>Image (JPG, PNG or WebP, up to 5 MB)</span><input type="file" name="file" accept="image/jpeg,image/png,image/webp"></label>
          <label class="field"><span>Sort order (lower shows first)</span><input type="number" name="sort_order" value="0"></label>
        </div>
        <div class="checks"><label><input type="checkbox" name="featured"> Show on homepage</label><label><input type="checkbox" name="published" checked> Published</label></div>
        <div class="btn-row"><button class="btn btn--solid" type="submit">Save project</button><button class="btn" id="cancel" type="button" hidden>Cancel edit</button></div>
        <p class="form__status" id="pstatus" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section id="homepage-editor">
      <h2 class="display h-md">Homepage content</h2>
      <p class="note">Edit the text displayed on your homepage. Changes are saved to Supabase and appear on the public website.</p>
      <form id="homeform" class="form">
        <div id="home-fields"></div>
        <div class="field"><label><input type="checkbox" name="show_philosophy" checked> Show philosophy section</label></div>
        <div class="field"><label><input type="checkbox" name="show_work" checked> Show featured work section</label></div>
        <div class="field"><label><input type="checkbox" name="show_services" checked> Show services section</label></div>
        <div class="field"><label><input type="checkbox" name="show_why" checked> Show why choose us section</label></div>
        <div class="field"><label><input type="checkbox" name="show_testimonials" checked> Show testimonials section</label></div>
        <div class="field"><label><input type="checkbox" name="show_cta" checked> Show call to action section</label></div>
        <label class="field"><span>Hero background image URL (HTTPS, optional)</span><input name="hero_image_url" type="url" placeholder="https://..."></label>
        <button class="btn btn--solid" type="submit">Save homepage changes</button>
        <p class="form__status" id="homestatus" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section><h2 class="display h-md">Projects</h2><div id="plist"></div></section>
    <section><h2 class="display h-md">Messages</h2><div id="mlist"></div></section>
  </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var login = $('#login'), app = $('#app'), pf = $('#pform'), editing = null, rows = [];
  if (!window.sb) { login.innerHTML = '<p class="form__status err">Supabase is not configured. Add your URL and anon key in js/supabase-config.js.</p>'; return; }
  pf.category.innerHTML = SITE.categories.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
  var say = function (el, m, ok) { el.textContent = m; el.className = 'form__status ' + (ok ? 'ok' : 'err'); };

  async function show() {
    var u = (await sb.auth.getUser()).data.user;
    if (!u) { login.hidden = false; app.hidden = true; return; }
    var a = await sb.from('admins').select('user_id').eq('user_id', u.id).maybeSingle();
    if (!a.data) { await sb.auth.signOut(); login.hidden = false; app.hidden = true; say($('#login-form').appendChild(document.createElement('p')), 'This account is not an admin.', false); return; }
    login.hidden = true; app.hidden = false; refresh();
  }
  async function refresh() {
    var p = await sb.from('projects').select('*').order('sort_order').order('created_at', { ascending: false });
    rows = p.data || [];
    $('#plist').innerHTML = rows.length ? rows.map(function (r) {
      return '<div class="row"><div><strong>' + esc(r.title) + '</strong><br><small>' + esc(r.category) + (r.published ? '' : ' · hidden') + (r.featured ? ' · homepage' : '') + '</small></div><div class="btn-row"><button class="btn" data-edit="' + r.id + '">Edit</button><button class="btn" data-del="' + r.id + '">Delete</button></div></div>';
    }).join('') : '<p class="note">No projects yet. Add your first one above.</p>';
    var m = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(50);
    $('#mlist').innerHTML = (m.data || []).map(function (x) {
      return '<div class="msg"><strong>' + esc(x.name) + '</strong> <small>' + esc(x.email) + (x.phone ? ' · ' + esc(x.phone) : '') + (x.service ? ' · ' + esc(x.service) : '') + ' · ' + new Date(x.created_at).toLocaleString() + '</small><p>' + esc(x.message) + '</p></div>';
    }).join('') || '<p class="note">No messages yet.</p>';
  }
  function reset() { editing = null; pf.reset(); $('#form-title').textContent = 'Add project'; $('#cancel').hidden = true; }

  $('#login-form').addEventListener('submit', async function (e) {
    e.preventDefault(); var f = e.target;
    var r = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (r.error) { var p = f.querySelector('p') || f.appendChild(document.createElement('p')); return say(p, 'Sign in failed. Check your email and password.', false); }
    f.reset(); show();
  });
  $('#signout').onclick = async function () { await sb.auth.signOut(); show(); };
  $('#cancel').onclick = reset;
  $('#plist').addEventListener('click', async function (e) {
    var ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) {
      var r = rows.find(function (x) { return x.id === ed.dataset.edit; }); editing = r;
      ['title', 'category', 'summary', 'client', 'year', 'sort_order'].forEach(function (k) { pf[k].value = r[k] == null ? '' : r[k]; });
      pf.featured.checked = r.featured; pf.published.checked = r.published;
      $('#form-title').textContent = 'Edit project'; $('#cancel').hidden = false; pf.scrollIntoView({ behavior: 'smooth' });
    }
    if (del && confirm('Delete this project? This cannot be undone.')) { await sb.from('projects').delete().eq('id', del.dataset.del); refresh(); }
  });
  pf.addEventListener('submit', async function (e) {
    e.preventDefault(); var st = $('#pstatus');
    if (!pf.checkValidity()) { pf.reportValidity(); return say(st, 'Title and category are required.', false); }
    var data = { title: pf.title.value.trim(), category: pf.category.value, summary: pf.summary.value.trim() || null, client: pf.client.value.trim() || null, year: pf.year.value.trim() || null,
      sort_order: parseInt(pf.sort_order.value, 10) || 0, featured: pf.featured.checked, published: pf.published.checked };
    var file = pf.file.files[0];
    if (file) {
      if (file.size > 5 * 1024 * 1024 || !/^image\/(jpeg|png|webp)$/.test(file.type)) return say(st, 'Use a JPG, PNG or WebP image under 5 MB.', false);
      var path = crypto.randomUUID() + '.' + file.type.split('/')[1];
      var up = await sb.storage.from('portfolio').upload(path, file, { contentType: file.type });
      if (up.error) return say(st, 'Image upload failed: ' + up.error.message, false);
      data.image_url = sb.storage.from('portfolio').getPublicUrl(path).data.publicUrl;
    }
    var r = editing ? await sb.from('projects').update(data).eq('id', editing.id) : await sb.from('projects').insert(data);
    if (r.error) return say(st, 'Could not save: ' + r.error.message, false);
    say(st, 'Project saved.', true); reset(); refresh();
  });
  // Homepage CMS editor
  var hf = $('#homeform'), hfields = $('#home-fields');
  if (hf && window.HOME_FIELDS) {
    var groups = {};
    HOME_FIELDS.forEach(function(f){ (groups[f.section] = groups[f.section] || []).push(f); });
    hfields.innerHTML = Object.keys(groups).map(function(group){
      return '<h3 style="margin:1.5rem 0 .7rem">'+esc(group)+'</h3>' + groups[group].map(function(f){
        return '<label class="field"><span>'+esc(f.label)+'</span>' +
          (f.multiline ? '<textarea name="'+esc(f.key)+'" rows="5"></textarea>' : '<input name="'+esc(f.key)+'" type="text">') + '</label>';
      }).join('');
    }).join('');
    async function loadHome(){
      var r = await sb.from('site_content').select('content').eq('content_key','homepage').maybeSingle();
      var data = r.data && r.data.content ? r.data.content : {};
      HOME_FIELDS.forEach(function(f){ if(hf.elements[f.key]) hf.elements[f.key].value = data[f.key] == null ? '' : data[f.key]; });
      ['philosophy','work','services','why','testimonials','cta'].forEach(function(k){
        hf.elements['show_'+k].checked = data['show_'+k] !== false;
      });
      hf.elements.hero_image_url.value = data.hero_image_url || '';
    }
    hf.addEventListener('submit', async function(e){
      e.preventDefault();
      var data = {};
      HOME_FIELDS.forEach(function(f){ data[f.key] = hf.elements[f.key].value.trim(); });
      ['philosophy','work','services','why','testimonials','cta'].forEach(function(k){ data['show_'+k] = hf.elements['show_'+k].checked; });
      data.hero_image_url = hf.elements.hero_image_url.value.trim();
      var status = $('#homestatus');
      var old = status.textContent; status.textContent = 'Saving…';
      var r = await sb.from('site_content').upsert({content_key:'homepage',content:data,updated_at:new Date().toISOString()},{onConflict:'content_key'});
      if(r.error) return say(status,'Could not save homepage: '+r.error.message,false);
      say(status,'Homepage changes saved successfully.',true);
    });
    // Called after the admin identity has been verified.
    var originalShow = show;
    show = async function(){ await originalShow(); if(!app.hidden) await loadHome(); };
  }
  show();
});
</script>
</body>
</html>
